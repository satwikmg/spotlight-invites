<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Scaler Spotlight — Vikram</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#171022; }
  video { width:100%; height:100%; object-fit:contain; display:block; background:#171022; }
  #tap {
    position:fixed; inset:0; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #tap .pill {
    position:absolute; left:50%; bottom:9%; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px;
    background:#0245B9; color:#fff; padding:14px 26px; border-radius:999px;
    font-size:17px; font-weight:700; letter-spacing:.3px; white-space:nowrap;
    box-shadow:0 8px 30px rgba(2,69,185,.6);
    animation:pulse 1.6s ease-in-out infinite;
  }
  #tap .pill svg { width:22px; height:22px; fill:#fff; flex:none; }
  @keyframes pulse {
    0%,100% { transform:translateX(-50%) scale(1); }
    50% { transform:translateX(-50%) scale(1.06); }
  }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<video id="v" src="../46e643a63ee7ddb9.mp4" autoplay muted playsinline></video>
<div id="tap">
  <div class="pill">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1c2.9.9 5 3.6 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.6 7-8.8s-3-7.8-7-8.8z"/></svg>
    Play with sound
  </div>
</div>
<script>
// video autoplays muted immediately (the only autoplay phones permit);
// tapping anywhere restarts it from the beginning with sound
var v = document.getElementById("v"), tap = document.getElementById("tap");
v.play().catch(function () {});
tap.addEventListener("click", function () {
  v.muted = false; v.currentTime = 0; v.controls = true;
  v.play(); tap.hidden = true;
});
</script>
</body>
</html>
